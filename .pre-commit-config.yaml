# Installed by `make setup` (uv run pre-commit install --hook-type pre-commit --hook-type commit-msg).
# Hooks are intentionally narrow: naming/scratchpad, hygiene, ruff, secrets, commit message.
# Scoped L3 gates (lint-scoped, anti-drift, coverage) run in `make check`, not per commit.
repos:
  - repo: local
    hooks:
      - id: code-canonicality-naming
        name: Code canonicality — naming and scratchpad guard
        entry: bash .git-hooks/check-naming.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: conventional-commit-msg
        name: Conventional Commits
        entry: bash .git-hooks/commit-msg
        language: system
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      # Staged files only, upstream strength (same rule set as `make lint`); never --fix
      # and never a repo-wide path — the fork must not rewrite untouched upstream files.
      - id: ruff
        files: ^backend/
        args: [--select=F, --ignore=F401,F403,F405,F541,F811,F841]
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
