  enforced_by: "scripts/lint-scoped.sh per-file ratchet; scripts/typecheck-ratchet.sh ceiling; other counts advisory"

# ── Rehabilitation State ───────────────────────────────────────
rehabilitation:
  active: false
  phase: "none"
  baseline_frozen: true
  command_entrypoint: "make check"
  runtime_verifier: "make smoke"
  broad_refactor_allowed: false
  work_unit_protocol: "issue-tracker"
  readiness_gaps: []
