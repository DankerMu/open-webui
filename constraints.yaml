  active: false
  kind: "none"
  source_of_truth: []
  compare_depth: "none"
  cutover_policy: "none"
  forbidden_moves: []
  work_ownership: "none"
  human_gates: []
  enforced_by: "n/a"

# ── Iteration Gates ────────────────────────────────────────────
iteration_gates:
