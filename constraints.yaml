# ── Code Canonicality ──────────────────────────────────────────
code_canonicality:
  forbidden_suffixes:
    description: "Filenames/identifiers matching these patterns are rejected at commit and at Claude Code write time"
    patterns:
      - "_v[0-9]+|_new|_old|_backup|_temp|_copy|_final|_real|_improved|_refactored|_fixed|_legacy|_deprecated|_archive|_save"
      - "V[0-9]+|New|Old|Legacy|Deprecated|Backup"
    enforced_by: ".git-hooks/check-naming.sh"
  scratchpad_directories:
    description: "Directories that must never appear in commits"
    paths: ["tmp", "scratch", "backup", "_old", "deprecated", "archive", "wip"]
    enforced_by: ".git-hooks/check-naming.sh + .gitignore"

# ── Size Limits ────────────────────────────────────────────────
# Scope: files in scripts/change-scope.sh (fork vs baseline.rev). Added files:
# full gate. Modified upstream files: ratchet (may not grow while over limit).
size_limits:
  max_file_lines:
    value: 800
    severity: "block"
    enforced_by: "scripts/lint-scoped.sh (line count) + eslint max-lines"
  max_complexity:
    value: 15                      # L3 minimum; ruff keeps upstream mccabe=10 (stricter), eslint complexity=15
    severity: "block"
    enforced_by: "ruff C901 (pyproject mccabe.max-complexity=10) + eslint complexity=15, via scripts/lint-scoped.sh"
  max_function_lines:
    value: 100
    severity: "review-only"
    enforced_by: "review — no lint rule wired (Python has no ruff rule; eslint max-lines-per-function not enabled to keep upstream diff minimal)"
  max_pr_diff_lines:
    value: 400
    description: "PRs exceeding this require justification or splitting"
    severity: "review-only"
    enforced_by: ".github/PULL_REQUEST_TEMPLATE.md checklist; ci.yml layer6-diff-size-guard inert until the fork has a remote"

# ── Test Discipline ────────────────────────────────────────────
testing:
  min_line_coverage:
    value: 80
    scope: "per-file, fork-added files"
    severity: "block"
    enforced_by: "scripts/coverage-gate.sh (make coverage-gate)"
  tdd_mode:
    value: "required"
    description: "Every new production file ships with a paired test file in the same change; coverage-gate is the mechanical floor"
  forbid_mock_of_system_under_test:
    value: true
    description: "Mock dependencies, never the system under test"

# ── Dependency Rules ───────────────────────────────────────────
dependencies:
  min_release_age_days:
    value: 7
    enforced_by: "review-only (no Renovate/Dependabot — fork has no remote)"
  no_circular_dependencies:
    value: true
    enforced_by: "review-only (import-linter not configured; upstream has cycles)"
  new_dependency_requires_justification:
    value: true
    description: "PR description must explain why existing tools can't do the job; upgrades need explicit confirmation (Forbidden Moves)"
  allowed_licenses:
    value: ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "MPL-2.0"]
    enforced_by: "review-only"

# ── Anti-Drift ─────────────────────────────────────────────────
anti_drift:
  duplicate_code_threshold_percent:
    value: 3
    severity: "block"
    enforced_by: "jscpd via scripts/anti-drift.sh (scoped; blind spot: new-vs-upstream duplication)"
  dead_code_min_confidence:
    value: 80
    severity: "block"
    enforced_by: "vulture (py) + knip (ts/svelte) via scripts/anti-drift.sh (scoped)"

# ── Module Boundaries ──────────────────────────────────────────
module_boundaries:
  layers: ["src/routes (pages)", "src/lib (components, apis, stores)", "backend/open_webui/routers", "backend/open_webui/models", "backend/open_webui/utils"]
  allowed_dependency_directions: ["routes -> lib", "routers -> models/utils", "models -> internal/db"]
  forbidden_import_patterns: []
  enforced_by: "review-only (upstream layering, no boundary tool wired)"

# ── Commit Discipline ──────────────────────────────────────────
commits:
  conventional_commits_required:
    value: true
    allowed_types: ["feat", "fix", "refactor", "chore", "docs", "test", "ci", "build", "perf"]
    enforced_by: ".git-hooks/commit-msg via pre-commit (stage commit-msg)"
    agent_co_author_required: true

# ── CI Pipeline ────────────────────────────────────────────────
ci:
  risk_layers: 5
  fast_checks_timeout_minutes: 10
  matrix: "ubuntu-latest, python 3.12, node 20"
  status: "rendered but inert — fork has no own remote; local enforcement = pre-commit + make check"

# ── Runtime Verification ───────────────────────────────────────
# Machine-readable mirror of the AGENTS.md Verification Matrix.
verification:
  health_url: "http://localhost:8080/health"
  dev_port: 8080
  frontend_port: 5173
  surfaces:
    liveness:
      command: "make dev-status"
      evidence: "process-live+health-ok"
      required_at: "L2+"
    api:
      command: "make smoke"
      evidence: "http-status+body"
      required_at: "L2+"
    ui:
      command: "make verify-ui"
      evidence: "screenshot+console-clean"
      required_at: "L3+"
    migration:
      command: "make db-verify"
      evidence: "up-down-up-clean"
      required_at: "L2+"
    guardrails:
      command: "make test-guardrails"
      evidence: "per-guard PASS"
      required_at: "L2+"
    docs:
      command: "make doc-gate"
      evidence: "exit 0"
      required_at: "L3+"
  enforced_by: "Stage 4 matrix-to-target check + PR Runtime evidence section"

# ── Exemptions ──────────────────────────────────────────────────
exemptions:
  entries:
    - path: "src/lib/i18n/"
      rules: [size_limits, duplicate_code_detection]
      reason: "Upstream translation catalogs — generated by i18next-parser, not human-authored"
      expires: never
      exit_condition: "none"
    - path: "src/lib/pyodide/"
      rules: [size_limits, duplicate_code_detection]
      reason: "Upstream vendored Pyodide loader"
      expires: never
      exit_condition: "none"
    - path: "static/"
      rules: [size_limits, duplicate_code_detection]
      reason: "Static assets and fetched Pyodide packages"
      expires: never
      exit_condition: "none"
    - path: "backend/open_webui/static/"
      rules: [size_limits, duplicate_code_detection]
      reason: "Upstream static assets served by FastAPI"
      expires: never
      exit_condition: "none"
    - path: "backend/open_webui/migrations/versions/"
      rules: [size_limits, duplicate_code_detection]
      reason: "Alembic migrations — generated, immutable once shipped"
      expires: never
      exit_condition: "none"
    - path: "src/lib/emoji-"
      rules: [size_limits, duplicate_code_detection]
      reason: "Upstream emoji data JSON"
      expires: never
      exit_condition: "none"
  enforced_by: "scripts/lint-scoped.sh and scripts/anti-drift.sh skip these prefixes"

