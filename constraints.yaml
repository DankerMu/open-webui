# constraints.yaml — Machine-readable engineering constraints
# THIS FILE IS THE CANONICAL SOURCE for all regex patterns and numeric thresholds.
# Enforcement scripts (scripts/*.sh, .git-hooks/*) read from here at runtime.
# Generated by eng-init on 2026-09-20 (bootstrap, profile L3).

# ── Strictness Profile ─────────────────────────────────────────
strictness_profile:
  schema_version: "3.6.0"
  level: "L3"
  chosen_by_user: true
  downgrades:
    - control: sast
      profile_default: "required (CI block)"
      chosen: "review-only"
      reason: "no semgrep locally; CodeQL is GitHub-hosted and this fork has no own remote (origin = upstream open-webui/open-webui)"
    - control: backend_typecheck
      profile_default: "mypy --strict"
      chosen: "not installed"
      reason: "upstream backend is untyped; even scoped runs drown in import-chain errors. Frontend types covered by svelte-check"
    - control: branch_protection
      profile_default: "gate (required status checks)"
      chosen: "none"
      reason: "no fork remote yet — gate impossible; re-evaluate when the fork gets its own GitHub remote"
    - control: pr_diff_limit
      profile_default: "block (CI diff-size guard)"
      chosen: "review-only"
      reason: "CI does not run for this fork (no remote); guard is rendered in ci.yml but inert until then"
    - control: coverage_gate_scope
      profile_default: "80% per-file, block, every file"
      chosen: "80% per-file block on fork-ADDED files; fork-MODIFIED upstream files advisory"
      reason: "freeze-baseline (Q1.4b): upstream ships 0 backend tests; gating modified upstream files would freeze every upstream touch"
  governance:
    - decision: "人工不审代码，只审最终功能呈现"
      effect: "Critical Paths require mechanical evidence + reviewer-subagent cross-review instead of human white-box review; CODEOWNERS not installed"

