baseline:
  mode: "freeze"
  rev: "2a960a59fe1dbbd35282f0556b3666d81102e781"   # upstream tag v0.11.3 — scope base for every gate
  frozen_on: "2026-09-20"
  counts:                                            # recorded ceilings for upstream code; advisory
    size_violations: 75      # files > 800 lines (src + backend, exemptions excluded)
    complexity_violations: 110   # functions with ruff C901 > 15 in backend
    lint_errors: 2594        # ruff check backend with current pyproject config
    typecheck_errors: 7789   # svelte-check --output machine, repo-wide; CI-compared ceiling via scripts/typecheck-ratchet.sh
