# Weekly proof that AGENTS.md still matches the Makefile and that every guard
# still rejects its violation. Inert until the fork has its own remote.
name: AGENTS.md liveness

on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths: [AGENTS.md, Makefile, constraints.yaml, scripts/**, .git-hooks/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveness:
    name: AGENTS.md command table vs Makefile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/doc-gate.sh
      - name: Dry-run documented make targets
        run: |
          for t in $(grep -oE '`make [A-Za-z0-9_.-]+' AGENTS.md | sed 's/`make //' | sort -u); do
            make -n "$t" >/dev/null || { echo "::error::make -n $t failed"; exit 1; }
          done

  guardrail-self-test:
    name: Guardrail self-test
    runs-on: ubuntu-latest
    # 5 minutes fit npm ci plus the script (~1.5 min); the backend venv adds ~70 s with a warm uv
    # cache (ci.yml layer1) and minutes more on a cold one, which would kill case 11 mid-run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      # Case 11 runs backend pytest with $repo_root/.venv/bin/python (#695); --no-install-project
      # keeps open_webui resolving through sys.path to the temp worktree, not this checkout.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev --no-install-project
      - run: npm ci
      - run: bash scripts/test-guardrails.sh
