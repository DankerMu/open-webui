# CI — risk-layered gates for the fork. NOTE: this workflow is inert until the
# fork has its own GitHub remote (origin currently points at upstream). Local
# enforcement today: pre-commit hooks + `make check` (AGENTS.md § Enforcement Index).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  layer1-fast-checks:
    name: Fast checks (fmt + lint + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: npm ci
      - run: make fmt-check
      - run: make lint
      - run: make typecheck
      - run: make lint-scoped

  layer2-unit-tests:
    name: Unit tests + coverage gate
    needs: layer1-fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: npm ci
      - run: make test
      - run: make coverage-gate

  layer3-integration-tests:
    name: Runtime verification (smoke + migrations + UI)
    needs: layer2-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: npm ci
      - name: Install hurl
        run: |
          curl -fsSL --retry 3 -o /tmp/hurl.deb \
            https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb
          sudo dpkg -i /tmp/hurl.deb
      - run: npx playwright install --with-deps chromium
      - run: make db-verify
      - run: make dev-bg
      - run: make smoke
      - run: make verify-ui
      - run: make dev-stop
        if: always()

  layer4-anti-drift:
    name: Anti-drift (duplicate + dead code, scoped) + docs
    needs: layer1-fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: npm ci
      - name: Verify constraints.yaml is the naming-guard source
        run: grep -q 'constraints\.yaml' .git-hooks/check-naming.sh
      - run: make anti-drift
      - run: make doc-gate
      - run: make decisions-verify

  layer5-secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lockfile-consistency:
    name: Lockfile–manifest consistency
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check lockfile–manifest pairs
        if: "!contains(github.event.pull_request.labels.*.name, 'lockfile-refresh')"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          check_pair() {
            lock="$1"; manifest="$2"
            if echo "$changed" | grep -qx "$lock" && ! echo "$changed" | grep -qx "$manifest"; then
              echo "::error::$lock changed but $manifest did not. Revert the lockfile, or add the 'lockfile-refresh' label with a justification."
              exit 1
            fi
          }
          check_pair package-lock.json package.json
          check_pair uv.lock pyproject.toml

  # L3: PR diff size guard. Inert until the fork has a remote; review-only via PR template meanwhile.
  layer6-diff-size-guard:
    name: PR diff size guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce max PR diff lines
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'diff-limit-exempt') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          MAX_DIFF_LINES=$(sed -n '/^  max_pr_diff_lines:/,/severity/p' constraints.yaml | sed -n 's/^ *value: *\([0-9]*\).*/\1/p' | head -n 1)
          LINES=$(git diff --diff-filter=ACMR --ignore-all-space "$BASE_SHA"...HEAD -- . \
            ':(exclude)*.lock' ':(exclude)**/package-lock.json' ':(exclude)**/__snapshots__/**' ':(exclude)src/lib/i18n/**' | grep -c '^[+-][^+-]' || true)
          echo "Changed lines (excluding lockfiles/snapshots/i18n): $LINES (limit: $MAX_DIFF_LINES)"
          if [ "$LINES" -gt "$MAX_DIFF_LINES" ]; then
            echo "::error::PR exceeds the ${MAX_DIFF_LINES}-line diff limit. Split it, or add the 'diff-limit-exempt' label with a justification."
            exit 1
          fi

  # Branch protection points at ONLY this check. `if: always()` is load-bearing:
  # GitHub treats a skipped required check as passing.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      - layer1-fast-checks
      - layer2-unit-tests
      - layer3-integration-tests
      - layer4-anti-drift
      - layer5-secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail on any failed, cancelled, or skipped required job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "::error::A required job failed, was cancelled, or was skipped. Skipped counts as failure here because GitHub counts a skipped required check as passing."
            exit 1
          fi
