name: OCU popup diagnostic

on:
  pull_request:
    paths:
      - scripts/reproduce-ocu-popup.mjs
      - .github/workflows/ocu-popup-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocu-popup-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-popup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make reproduce-ocu-popup
      - name: Upload sanitized popup characterization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocu-popup-diagnostic
          path: .run/ocu-popup-repro/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
